[package]
name = "kbzone"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
rusqlite   = { version = "0.40", features = ["bundled", "load_extension"] }
uuid       = { version = "1", features = ["v4"] }
thiserror  = "2"
chrono     = { version = "0.4", default-features = false, features = ["clock"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlite-vec = "0.1.9"
fastembed  = "6"
stop-words = "0.10"
ureq       = "3"

[dev-dependencies]
tempfile = "3"
